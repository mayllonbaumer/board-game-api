apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-reader-binding
  namespace: default  # Mude para o namespace onde sua aplicação está implantada
subjects:
- kind: ServiceAccount
  name: deploy-gke  # Nome da sua conta de serviço
  namespace: default  # Namespace onde a conta de serviço está localizada
roleRef:
  kind: Role
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io
